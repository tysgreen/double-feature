[server]
enableStaticServing = true

[client]
toolbarMode = "minimal"

# The light theme below is the base. Each person can pick a background colour or "After dark" in
# Settings; the app applies that on top with CSS, so these are just the defaults.
[theme]
base = "light"
primaryColor = "#1F1A17"
backgroundColor = "#ECE7F7"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1F1A17"
linkColor = "#1F1A17"
borderColor = "#1F1A17"
baseRadius = "14px"
buttonRadius = "16px"
font = "Bricolage Grotesque, sans-serif"
headingFont = "Bricolage Grotesque, sans-serif"
headingFontWeights = [800, 800, 800, 700, 700, 700]

[[theme.fontFaces]]
family = "Bricolage Grotesque"
url = "app/static/bricolage.woff2"
weight = "200 800"
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"

[[theme.fontFaces]]
family = "Bricolage Grotesque"
url = "app/static/bricolage-ext.woff2"
weight = "200 800"
unicodeRange = "U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF"
